<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - EmotiScan AI</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
        }

        /* Efecto de burbujas de fondo */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: flotar 15s ease-in-out infinite alternate;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #e94560;
            top: -100px;
            right: -100px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #0f3460;
            bottom: -80px;
            left: -80px;
            animation-delay: -5s;
        }

        @keyframes flotar {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* ============================================
           TARJETA PRINCIPAL
           ============================================ */
        .register-box {
            width: 100%;
            max-width: 420px;
            padding: 45px 40px;
            border-radius: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            color: white;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           LOGO / TÍTULO
           ============================================ */
        .logo-icon {
            font-size: 60px;
            margin-bottom: 10px;
            display: block;
        }

        .register-box h2 {
            font-size: 30px;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .register-box .subtitle {
            color: #a8d8ea;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 30px;
            letter-spacing: 1px;
            -webkit-text-fill-color: #a8d8ea;
        }

        /* ============================================
           MENSAJE DE ERROR (INICIALMENTE OCULTO)
           ============================================ */
        #error-message {
            display: none;
            background: rgba(233, 69, 96, 0.15);
            border: 2px solid #e94560;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
            animation: shakeError 0.5s ease;
        }

        #error-message.show {
            display: block;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* ============================================
           CAMPOS DEL FORMULARIO
           ============================================ */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            color: rgb(226, 229, 233);
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 18px 14px 50px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #e94560;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.15);
        }

        .input-wrapper input:focus + i,
        .input-wrapper input:focus ~ i {
            color: #e94560;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-wrapper input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #1a1a2e inset !important;
            -webkit-text-fill-color: #fff !important;
        }

        /* ============================================
           BOTÓN REGISTRAR
           ============================================ */
        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e94560, #c73652);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-register:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.3);
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-register .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        .btn-register .spinner.show {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           ENLACE A LOGIN
           ============================================ */
        .login-link {
            margin-top: 25px;
            color: #a8d8ea;
            font-size: 14px;
        }

        .login-link a {
            color: #e94560;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #ff6b6b;
            text-decoration: underline;
        }

        /* ============================================
           FOOTER
           ============================================ */
        .footer {
            margin-top: 35px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* ============================================
           CONFETTI / CELEBRACIÓN
           ============================================ */
        #confetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 500px) {
            .register-box {
                padding: 35px 25px;
            }

            .register-box h2 {
                font-size: 24px;
            }

            .logo-icon {
                font-size: 45px;
            }
        }
    </style>
</head>
<body>

    <!-- LIENZO PARA CONFETTI -->
    <canvas id="confetti"></canvas>

    <!-- ============================================
    TARJETA DE REGISTRO
    ============================================ -->
    <div class="register-box">

        <!-- ICONO -->
        <span class="logo-icon">🧠</span>

        <!-- TÍTULO -->
        <h2>EmotiScan AI</h2>
        <p class="subtitle">Crea una cuenta para comenzar</p>

        <!-- MENSAJE DE ERROR -->
        <div id="error-message">
            ❌ El usuario ya existe o los datos son inválidos
        </div>

        <!-- FORMULARIO -->
        <form action="/guardar" method="POST" id="register-form">

            <div class="form-group">
                <label for="usuario">
                    <i class="fa-solid fa-user" style="color: rgb(226, 229, 233);"></i> Usuario
                </label>
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        autocomplete="off"
                        required
                    >
                    <i class="fa-solid fa-user" style="color: rgb(226, 229, 233);"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fa-solid fa-lock" style="color: rgb(226, 229, 233);"></i> Contraseña
                </label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="off"
                        required
                        minlength="4"
                    >
                    <i class="fa-solid fa-lock" style="color: rgb(226, 229, 233);"></i>
                </div>
            </div>

            <button type="submit" class="btn-register" id="register-btn">
                <span class="spinner" id="spinner"></span>
                <span id="btn-text">
                    <i class="fa-solid fa-user-plus"></i> Registrarme
                </span>
            </button>

        </form>

        <!-- ENLACE A LOGIN -->
        <div class="login-link">
            ¿Ya tienes cuenta? <a href="/">Inicia sesión</a>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            © 2026 EmotiScan AI
        </div>

    </div>

    <!-- ============================================
    SCRIPTS
    ============================================ -->
    <script>
        // ============================================
        // 1. CONFETTI
        // ============================================
        const canvas = document.getElementById("confetti");
        const ctx = canvas.getContext("2d");
        let particulas = [];
        let animacionActiva = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function crearParticulas() {
            particulas = [];
            for (let i = 0; i < 180; i++) {
                particulas.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    r: Math.random() * 5 + 2,
                    color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                    vx: (Math.random() - 0.5) * 6,
                    vy: Math.random() * 5 + 3
                });
            }
        }

        function animarConfetti() {
            if (!animacionActiva) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let activas = false;
            particulas.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                if (p.y < canvas.height + 20) activas = true;
            });

            if (activas) {
                requestAnimationFrame(animarConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                animacionActiva = false;
            }
        }

        function lanzarConfetti() {
            crearParticulas();
            animacionActiva = true;
            animarConfetti();
            setTimeout(() => {
                animacionActiva = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 5000);
        }

        // ============================================
        // 2. LIMPIAR CAMPOS AL CARGAR
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('usuario').value = '';
            document.getElementById('password').value = '';
            ocultarError();
            console.log('🧹 Página de registro limpiada');
        });

        // ============================================
        // 3. MANEJAR ENVÍO DEL FORMULARIO
        // ============================================
        document.getElementById('register-form').addEventListener('submit', function(e) {
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!usuario || !password) {
                e.preventDefault();
                mostrarError('⚠️ Por favor completa todos los campos');
                return;
            }

            if (password.length < 4) {
                e.preventDefault();
                mostrarError('⚠️ La contraseña debe tener al menos 4 caracteres');
                return;
            }

            const btn = document.getElementById('register-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');

            btn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creando cuenta...';
            spinner.classList.add('show');
            ocultarError();

            lanzarConfetti();
        });

        // ============================================
        // 4. FUNCIONES DE ERROR
        // ============================================
        function mostrarError(mensaje) {
            const errorMsg = document.getElementById('error-message');
            if (mensaje) {
                errorMsg.textContent = '❌ ' + mensaje;
            } else {
                errorMsg.textContent = '❌ El usuario ya existe o los datos son inválidos';
            }
            errorMsg.style.display = 'block';
            void errorMsg.offsetWidth;
            errorMsg.classList.add('show');
        }

        function ocultarError() {
            const errorMsg = document.getElementById('error-message');
            errorMsg.classList.remove('show');
            errorMsg.style.display = 'none';
        }

        // ============================================
        // 5. LIMPIAR ERROR AL ESCRIBIR
        // ============================================
        document.getElementById('usuario').addEventListener('input', ocultarError);
        document.getElementById('password').addEventListener('input', ocultarError);

        // ============================================
        // 6. DETECTAR ERROR DEL SERVIDOR
        // ============================================
        window.addEventListener('load', function() {
            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');

            if (error === 'exists') {
                mostrarError('El usuario ya existe. Prueba con otro nombre');
                document.getElementById('usuario').value = '';
                document.getElementById('password').value = '';

                const btn = document.getElementById('register-btn');
                const btnText = document.getElementById('btn-text');
                const spinner = document.getElementById('spinner');
                btn.disabled = false;
                btnText.innerHTML = '<i class="fa-solid fa-user-plus"></i> Registrarme';
                spinner.classList.remove('show');
            }
        });

        // ============================================
        // 7. TIMEOUT PARA ERROR DE CONEXIÓN
        // ============================================
        document.getElementById('register-form').addEventListener('submit', function(e) {
            const timeoutId = setTimeout(function() {
                const btn = document.getElementById('register-btn');
                const btnText = document.getElementById('btn-text');
                const spinner = document.getElementById('spinner');

                btn.disabled = false;
                btnText.innerHTML = '<i class="fa-solid fa-user-plus"></i> Registrarme';
                spinner.classList.remove('show');

                mostrarError('Error de conexión. Intenta nuevamente');
            }, 10000);

            window._registerTimeout = timeoutId;
        });

        window.addEventListener('beforeunload', function() {
            if (window._registerTimeout) {
                clearTimeout(window._registerTimeout);
            }
        });

        console.log('🚀 EmotiScan Registro cargado correctamente');
        console.log('💡 Campos vacíos al inicio');
    </script>

</body>
</html>
