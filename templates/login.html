<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EmotiScan AI - Iniciar sesión</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        /* =====================================================
           GENERAL
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #1a1a2e 0%,
                    #16213e 50%,
                    #0f3460 100%
                );

            position: relative;

            overflow: hidden;

            color: white;
        }


        /* =====================================================
           BURBUJAS DE FONDO
           ===================================================== */

        body::before,
        body::after {

            content: "";

            position: absolute;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.3;

            animation:
                flotar
                15s
                ease-in-out
                infinite
                alternate;
        }

        body::before {

            width: 400px;

            height: 400px;

            background: #e94560;

            top: -100px;

            right: -100px;
        }

        body::after {

            width: 350px;

            height: 350px;

            background: #0f3460;

            bottom: -80px;

            left: -80px;

            animation-delay: -5s;
        }


        @keyframes flotar {

            0% {

                transform:
                    translate(0, 0)
                    scale(1);
            }

            100% {

                transform:
                    translate(50px, 50px)
                    scale(1.2);
            }
        }


        /* =====================================================
           TARJETA
           ===================================================== */

        .container {

            width: 100%;

            max-width: 420px;

            padding: 45px 40px;

            border-radius: 30px;

            text-align: center;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            box-shadow:
                0 25px 50px
                rgba(
                    0,
                    0,
                    0,
                    0.5
                );

            color: white;

            position: relative;

            z-index: 10;

            animation:
                fadeIn
                0.8s
                ease;
        }


        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(-30px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo-icon {

            width: 80px;

            height: 80px;

            margin:
                0 auto 15px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #e94560,
                    #8e44ad
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

            box-shadow:
                0 10px 30px
                rgba(
                    233,
                    69,
                    96,
                    0.3
                );
        }


        /* =====================================================
           TÍTULO
           ===================================================== */

        h1 {

            font-size: 30px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #e94560,
                    #ff6b6b
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            background-clip: text;

            letter-spacing: -1px;
        }


        .subtitle {

            color: #a8d8ea;

            font-size: 14px;

            margin-top: 8px;

            margin-bottom: 30px;

            letter-spacing: 0.5px;
        }


        /* =====================================================
           MENSAJE DE ERROR
           ===================================================== */

        #error-message {

            display: none;

            background:
                rgba(
                    233,
                    69,
                    96,
                    0.15
                );

            border:
                1px solid
                rgba(
                    233,
                    69,
                    96,
                    0.5
                );

            border-radius: 12px;

            padding: 12px 16px;

            margin-bottom: 20px;

            color: #ff8080;

            font-size: 14px;

            text-align: center;

            animation:
                shakeError
                0.5s
                ease;
        }


        #error-message.show {

            display: block;
        }


        @keyframes shakeError {

            0%,
            100% {

                transform:
                    translateX(0);
            }

            25% {

                transform:
                    translateX(-8px);
            }

            75% {

                transform:
                    translateX(8px);
            }
        }


        /* =====================================================
           MENSAJE DE ÉXITO
           ===================================================== */

        #success-message {

            display: none;

            background:
                rgba(
                    70,
                    200,
                    120,
                    0.15
                );

            border:
                1px solid
                rgba(
                    70,
                    200,
                    120,
                    0.4
                );

            border-radius: 12px;

            padding: 12px 16px;

            margin-bottom: 20px;

            color: #70e0a0;

            font-size: 14px;
        }


        /* =====================================================
           FORMULARIO
           ===================================================== */

        .form-group {

            margin-bottom: 20px;

            text-align: left;
        }


        .form-group label {

            display: block;

            color: #e0e0e0;

            font-size: 14px;

            font-weight: 500;

            margin-bottom: 8px;

            letter-spacing: 0.5px;
        }


        /* =====================================================
           INPUT
           ===================================================== */

        .input-wrapper {

            position: relative;
        }


        .input-wrapper i {

            position: absolute;

            top: 50%;

            left: 18px;

            transform:
                translateY(-50%);

            color: #dfe5ec;

            font-size: 17px;

            z-index: 2;

            transition:
                color
                0.3s
                ease;
        }


        .input-wrapper input {

            width: 100%;

            padding:
                14px
                18px
                14px
                50px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border:
                2px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            border-radius: 12px;

            color: white;

            font-size: 16px;

            outline: none;

            transition:
                all
                0.3s
                ease;
        }


        .input-wrapper input:focus {

            border-color: #e94560;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            box-shadow:
                0 0 20px
                rgba(
                    233,
                    69,
                    96,
                    0.15
                );
        }


        .input-wrapper:focus-within i {

            color: #e94560;
        }


        .input-wrapper input::placeholder {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );
        }


        /* =====================================================
           AUTOCOMPLETADO
           ===================================================== */

        .input-wrapper input:-webkit-autofill {

            -webkit-box-shadow:
                0 0 0 30px
                #1a1a2e
                inset !important;

            -webkit-text-fill-color:
                #fff !important;
        }


        /* =====================================================
           BOTÓN
           ===================================================== */

        .btn-login {

            width: 100%;

            padding: 16px;

            background:
                linear-gradient(
                    135deg,
                    #e94560,
                    #c73652
                );

            border: none;

            border-radius: 12px;

            color: white;

            font-size: 18px;

            font-weight: 600;

            cursor: pointer;

            transition:
                all
                0.3s
                ease;

            letter-spacing: 0.5px;

            margin-top: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;
        }


        .btn-login:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(
                    233,
                    69,
                    96,
                    0.3
                );
        }


        .btn-login:active {

            transform:
                scale(0.98);
        }


        .btn-login:disabled {

            opacity: 0.6;

            cursor:
                not-allowed;

            transform: none;
        }


        /* =====================================================
           SPINNER
           ===================================================== */

        .spinner {

            display: none;

            width: 20px;

            height: 20px;

            border:
                3px solid
                rgba(
                    255,
                    255,
                    255,
                    0.3
                );

            border-radius: 50%;

            border-top-color: white;

            animation:
                spin
                0.8s
                linear
                infinite;
        }


        .spinner.show {

            display: inline-block;
        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }


        /* =====================================================
           REGISTRO
           ===================================================== */

        .register-link {

            margin-top: 25px;

            color: #a8d8ea;

            font-size: 14px;
        }


        .register-link a {

            color: #e94560;

            text-decoration: none;

            font-weight: 600;

            transition:
                color
                0.3s
                ease;
        }


        .register-link a:hover {

            color: #ff6b6b;

            text-decoration: underline;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .footer {

            margin-top: 35px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

            font-size: 12px;

            letter-spacing: 1px;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 500px) {

            .container {

                padding:
                    35px 25px;
            }

            h1 {

                font-size: 26px;
            }

            .logo-icon {

                width: 70px;

                height: 70px;

                font-size: 35px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         TARJETA PRINCIPAL
         ===================================================== -->

    <div class="container">


        <!-- LOGO -->

        <div class="logo-icon">

            🧠

        </div>


        <!-- TÍTULO -->

        <h1>

            EmotiScan AI

        </h1>


        <p class="subtitle">

            Reconocimiento Inteligente de Emociones

        </p>


        <!-- =================================================
             MENSAJES
             ================================================= -->

        <div id="error-message">

            ❌ Usuario o contraseña incorrectos

        </div>


        <div id="success-message">

            ✅ Inicio de sesión exitoso

        </div>


        <!-- =================================================
             FORMULARIO
             ================================================= -->

        <form
            id="login-form"
            action="/login"
            method="POST"
        >


            <!-- USUARIO / CORREO -->

            <div class="form-group">

                <label for="usuario">

                    <i class="fa-solid fa-user"></i>

                    Usuario o correo electrónico

                </label>


                <div class="input-wrapper">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario o correo"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- CONTRASEÑA -->

            <div class="form-group">

                <label for="password">

                    <i class="fa-solid fa-lock"></i>

                    Contraseña

                </label>


                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <!-- BOTÓN -->

            <button
                type="submit"
                class="btn-login"
                id="login-btn"
            >

                <span
                    class="spinner"
                    id="spinner"
                ></span>


                <span id="btn-text">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Ingresar

                </span>

            </button>


        </form>


        <!-- =================================================
             REGISTRO
             ================================================= -->

        <div class="register-link">

            ¿No tienes una cuenta?

            <a href="/registro">

                Crear una cuenta

            </a>

        </div>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <div class="footer">

            © 2026 EmotiScan AI

        </div>


    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>

        const formulario =
            document.getElementById(
                "login-form"
            );


        const usuarioInput =
            document.getElementById(
                "usuario"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const errorMessage =
            document.getElementById(
                "error-message"
            );


        const successMessage =
            document.getElementById(
                "success-message"
            );


        const loginBtn =
            document.getElementById(
                "login-btn"
            );


        const btnText =
            document.getElementById(
                "btn-text"
            );


        const spinner =
            document.getElementById(
                "spinner"
            );


        /* =================================================
           OCULTAR MENSAJES
           ================================================= */

        function ocultarMensajes() {

            errorMessage.classList.remove(
                "show"
            );

            errorMessage.style.display =
                "none";

            successMessage.style.display =
                "none";
        }


        /* =================================================
           MOSTRAR ERROR
           ================================================= */

        function mostrarError(
            mensaje
        ) {

            successMessage.style.display =
                "none";

            errorMessage.textContent =
                "❌ " + mensaje;

            errorMessage.style.display =
                "block";

            errorMessage.classList.remove(
                "show"
            );

            void errorMessage.offsetWidth;

            errorMessage.classList.add(
                "show"
            );
        }


        /* =================================================
           MOSTRAR ÉXITO
           ================================================= */

        function mostrarExito(
            mensaje
        ) {

            errorMessage.style.display =
                "none";

            successMessage.textContent =
                "✅ " + mensaje;

            successMessage.style.display =
                "block";
        }


        /* =================================================
           RESTABLECER BOTÓN
           ================================================= */

        function restaurarBoton() {

            loginBtn.disabled =
                false;

            btnText.innerHTML =
                '<i class="fa-solid fa-right-to-bracket"></i> Ingresar';

            spinner.classList.remove(
                "show"
            );
        }


        /* =================================================
           LIMPIAR AL CARGAR
           ================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                usuarioInput.value =
                    "";

                passwordInput.value =
                    "";

                ocultarMensajes();

                console.log(
                    "🧹 Login cargado correctamente"
                );
            }
        );


        /* =================================================
           LIMPIAR ERROR AL ESCRIBIR
           ================================================= */

        usuarioInput.addEventListener(
            "input",
            function() {

                ocultarMensajes();

            }
        );


        passwordInput.addEventListener(
            "input",
            function() {

                ocultarMensajes();

            }
        );


        /* =================================================
           LOGIN
           ================================================= */

        formulario.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const usuario =
                    usuarioInput
                    .value
                    .trim();


                const password =
                    passwordInput
                    .value;


                /* =========================================
                   VALIDAR
                   ========================================= */

                if (
                    !usuario ||
                    !password
                ) {

                    mostrarError(
                        "Por favor completa todos los campos."
                    );

                    return;
                }


                /* =========================================
                   ACTIVAR CARGANDO
                   ========================================= */

                loginBtn.disabled =
                    true;

                btnText.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';

                spinner.classList.add(
                    "show"
                );

                ocultarMensajes();


                try {

                    /* =====================================
                       ENVIAR AL SERVIDOR
                       ===================================== */

                    const respuesta =
                        await fetch(
                            "/login",
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        usuario:
                                            usuario,

                                        password:
                                            password

                                    })

                            }
                        );


                    /* =====================================
                       LEER RESPUESTA
                       ===================================== */

                    const resultado =
                        await respuesta.json();


                    console.log(
                        "Respuesta login:",
                        resultado
                    );


                    /* =====================================
                       LOGIN CORRECTO
                       ===================================== */

                    if (
                        respuesta.ok &&
                        resultado.success
                    ) {

                        mostrarExito(
                            "Inicio de sesión exitoso. Bienvenido/a " +
                            (
                                resultado.nombre ||
                                usuario
                            )
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    resultado.redirect ||
                                    "/inicio";

                            },
                            800
                        );


                        return;
                    }


                    /* =====================================
                       LOGIN INCORRECTO
                       ===================================== */

                    mostrarError(

                        resultado.error ||
                        "Usuario o contraseña incorrectos."

                    );


                    restaurarBoton();


                }

                catch (error) {

                    console.error(
                        "Error:",
                        error
                    );


                    mostrarError(
                        "No se pudo conectar con el servidor."
                    );


                    restaurarBoton();

                }

            }
        );


        /* =================================================
           MENSAJE DE ERROR DEL SERVIDOR
           ================================================= */

        window.addEventListener(
            "load",
            function() {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const error =
                    params.get(
                        "error"
                    );


                if (
                    error === "invalid"
                ) {

                    mostrarError(
                        "Usuario o contraseña incorrectos."
                    );

                    usuarioInput.value =
                        "";

                    passwordInput.value =
                        "";

                    restaurarBoton();

                }

            }
        );


        console.log(
            "🚀 EmotiScan AI Login cargado correctamente"
        );

    </script>


</body>

</html>
