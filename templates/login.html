<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EmotiScan AI - Iniciar sesión</title>
    <link rel="icon" type="image/x-icon"
      href="{{ url_for('static', filename='favicon.ico') }}">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #1a1a2e 0%,
                    #16213e 50%,
                    #0f3460 100%
                );

            position: relative;

            overflow: hidden;

            color: white;
        }

        body::before,
        body::after {

            content: "";

            position: absolute;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.3;

            animation:
                flotar
                15s
                ease-in-out
                infinite
                alternate;
        }

        body::before {

            width: 400px;

            height: 400px;

            background: #e94560;

            top: -100px;

            right: -100px;
        }

        body::after {

            width: 350px;

            height: 350px;

            background: #0f3460;

            bottom: -80px;

            left: -80px;

            animation-delay: -5s;
        }

        @keyframes flotar {

            0% {

                transform:
                    translate(0, 0)
                    scale(1);
            }

            100% {

                transform:
                    translate(50px, 50px)
                    scale(1.2);
            }
        }

        .container {

            width: 100%;

            max-width: 420px;

            padding: 45px 40px;

            border-radius: 30px;

            text-align: center;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.06
                );

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            box-shadow:
                0 25px 50px
                rgba(
                    0,
                    0,
                    0,
                    0.5
                );

            position: relative;

            z-index: 10;

            animation:
                fadeIn
                0.8s
                ease;
        }

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(-30px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        .logo-icon {

            width: 80px;

            height: 80px;

            margin:
                0 auto 15px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #e94560,
                    #8e44ad
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

            box-shadow:
                0 10px 30px
                rgba(
                    233,
                    69,
                    96,
                    0.3
                );
        }

        h1 {

            font-size: 30px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #e94560,
                    #ff6b6b
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            background-clip: text;
        }

        .subtitle {

            color: #a8d8ea;

            font-size: 14px;

            margin-top: 8px;

            margin-bottom: 30px;
        }

        .message {

            display: none;

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 12px;

            font-size: 14px;
        }

        .error {

            background:
                rgba(
                    233,
                    69,
                    96,
                    0.15
                );

            border:
                1px solid
                rgba(
                    233,
                    69,
                    96,
                    0.5
                );

            color: #ff8080;
        }

        .success {

            background:
                rgba(
                    70,
                    200,
                    120,
                    0.15
                );

            border:
                1px solid
                rgba(
                    70,
                    200,
                    120,
                    0.4
                );

            color: #70e0a0;
        }

        .form-group {

            margin-bottom: 20px;

            text-align: left;
        }

        .form-group label {

            display: block;

            color: #e0e0e0;

            font-size: 14px;

            font-weight: 500;

            margin-bottom: 8px;
        }

        .input-wrapper {

            position: relative;
        }

        .input-wrapper i {

            position: absolute;

            top: 50%;

            left: 18px;

            transform:
                translateY(-50%);

            color: #dfe5ec;

            font-size: 17px;

            z-index: 2;
        }

        .input-wrapper input {

            width: 100%;

            padding:
                14px
                18px
                14px
                50px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border:
                2px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            border-radius: 12px;

            color: white;

            font-size: 16px;

            outline: none;
        }

        .input-wrapper input:focus {

            border-color: #e94560;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            box-shadow:
                0 0 20px
                rgba(
                    233,
                    69,
                    96,
                    0.15
                );
        }

        .input-wrapper input::placeholder {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );
        }

        .btn-login {

            width: 100%;

            padding: 16px;

            background:
                linear-gradient(
                    135deg,
                    #e94560,
                    #c73652
                );

            border: none;

            border-radius: 12px;

            color: white;

            font-size: 18px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            transition:
                all
                0.3s
                ease;
        }

        .btn-login:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(
                    233,
                    69,
                    96,
                    0.3
                );
        }

        .btn-login:disabled {

            opacity: 0.6;

            cursor:
                not-allowed;

            transform: none;
        }

        .spinner {

            display: none;

            width: 18px;

            height: 18px;

            border:
                3px solid
                rgba(
                    255,
                    255,
                    255,
                    0.3
                );

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin
                0.8s
                linear
                infinite;
        }

        .spinner.show {

            display: inline-block;
        }

        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }

        .register-link {

            margin-top: 25px;

            color: #a8d8ea;

            font-size: 14px;
        }

        .register-link a {

            color: #e94560;

            text-decoration: none;

            font-weight: 600;
        }

        .register-link a:hover {

            text-decoration: underline;

            color: #ff6b6b;
        }

        .footer {

            margin-top: 35px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

            font-size: 12px;
        }

        @media (max-width: 500px) {

            .container {

                padding:
                    35px 25px;
            }

            h1 {

                font-size: 26px;
            }

            .logo-icon {

                width: 70px;

                height: 70px;

                font-size: 35px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo-icon">
        🧠
    </div>


    <h1>
        EmotiScan AI
    </h1>


    <p class="subtitle">
        Reconocimiento Inteligente de Emociones
    </p>


    <div
        id="error-message"
        class="message error"
    ></div>


    <div
        id="success-message"
        class="message success"
    ></div>


    <form
        id="login-form"
    >


        <!-- ==========================================
             USUARIO O CORREO
             ========================================== -->

        <div class="form-group">

            <label for="usuario">

                <i class="fa-solid fa-user"></i>

                Usuario o correo electrónico

            </label>


            <div class="input-wrapper">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingresa tu usuario o correo"
                    autocomplete="username"
                    required
                >

            </div>

        </div>


        <!-- ==========================================
             CONTRASEÑA
             ========================================== -->

        <div class="form-group">

            <label for="password">

                <i class="fa-solid fa-lock"></i>

                Contraseña

            </label>


            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    required
                >

            </div>

        </div>


        <!-- ==========================================
             BOTÓN
             ========================================== -->

        <button
            type="submit"
            class="btn-login"
            id="login-btn"
        >

            <span
                class="spinner"
                id="spinner"
            ></span>


            <span id="btn-text">

                <i class="fa-solid fa-right-to-bracket"></i>

                Ingresar

            </span>

        </button>


    </form>


    <div class="register-link">

        ¿No tienes una cuenta?

        <a href="/registro">

            Crear una cuenta

        </a>

    </div>


    <div class="footer">

        © 2026 EmotiScan AI

    </div>


</div>


<script>


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const formulario =
        document.getElementById(
            "login-form"
        );

    const usuarioInput =
        document.getElementById(
            "usuario"
        );

    const passwordInput =
        document.getElementById(
            "password"
        );

    const errorMessage =
        document.getElementById(
            "error-message"
        );

    const successMessage =
        document.getElementById(
            "success-message"
        );

    const loginBtn =
        document.getElementById(
            "login-btn"
        );

    const btnText =
        document.getElementById(
            "btn-text"
        );

    const spinner =
        document.getElementById(
            "spinner"
        );


    // =====================================================
    // MOSTRAR ERROR
    // =====================================================

    function mostrarError(mensaje) {

        successMessage.style.display =
            "none";

        errorMessage.textContent =
            "❌ " + mensaje;

        errorMessage.style.display =
            "block";
    }


    // =====================================================
    // MOSTRAR ÉXITO
    // =====================================================

    function mostrarExito(mensaje) {

        errorMessage.style.display =
            "none";

        successMessage.textContent =
            "✅ " + mensaje;

        successMessage.style.display =
            "block";
    }


    // =====================================================
    // OCULTAR MENSAJES
    // =====================================================

    function ocultarMensajes() {

        errorMessage.style.display =
            "none";

        successMessage.style.display =
            "none";
    }


    // =====================================================
    // RESTAURAR BOTÓN
    // =====================================================

    function restaurarBoton() {

        loginBtn.disabled =
            false;

        spinner.classList.remove(
            "show"
        );

        btnText.innerHTML =
            '<i class="fa-solid fa-right-to-bracket"></i> Ingresar';
    }


    // =====================================================
    // ENVIAR LOGIN
    // =====================================================

    formulario.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const identificador =
                usuarioInput.value.trim();

            const password =
                passwordInput.value;


            // =============================================
            // VALIDAR
            // =============================================

            if (
                !identificador ||
                !password
            ) {

                mostrarError(
                    "Por favor completa todos los campos."
                );

                return;
            }


            // =============================================
            // MOSTRAR CARGANDO
            // =============================================

            ocultarMensajes();

            loginBtn.disabled =
                true;

            spinner.classList.add(
                "show"
            );

            btnText.innerHTML =
                "Verificando...";


            // =============================================
            // DETERMINAR SI ES EMAIL O USUARIO
            // =============================================

            const esEmail =
                identificador.includes("@");


            let datos;


            if (esEmail) {

                datos = {

                    email:
                        identificador,

                    password:
                        password

                };

            } else {

                datos = {

                    usuario:
                        identificador,

                    password:
                        password

                };

            }


            console.log(
                "📤 Enviando login:",
                datos
            );


            // =============================================
            // TIMEOUT
            // =============================================

            const controller =
                new AbortController();


            const timeout =
                setTimeout(
                    function() {

                        controller.abort();

                    },
                    15000
                );


            try {


                // =========================================
                // PETICIÓN
                // =========================================

                const respuesta =
                    await fetch(
                        "/login",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"

                            },

                            credentials:
                                "same-origin",

                            body:
                                JSON.stringify(
                                    datos
                                ),

                            signal:
                                controller.signal

                        }
                    );


                clearTimeout(
                    timeout
                );


                console.log(
                    "📥 Estado:",
                    respuesta.status
                );


                // =========================================
                // LEER RESPUESTA
                // =========================================

                const texto =
                    await respuesta.text();


                console.log(
                    "📥 Respuesta:",
                    texto
                );


                let resultado;


                try {

                    resultado =
                        JSON.parse(
                            texto
                        );

                } catch (error) {

                    console.error(
                        "❌ El servidor no devolvió JSON"
                    );

                    mostrarError(
                        "El servidor devolvió una respuesta inesperada."
                    );

                    restaurarBoton();

                    return;
                }


                // =========================================
                // LOGIN CORRECTO
                // =========================================

                if (
                    respuesta.ok &&
                    resultado.success === true
                ) {

                    mostrarExito(
                        "Inicio de sesión exitoso. Bienvenido/a " +
                        (
                            resultado.nombre ||
                            identificador
                        )
                    );


                    console.log(
                        "✅ Login correcto"
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                resultado.redirect ||
                                "/inicio";

                        },
                        800
                    );


                    return;
                }


                // =========================================
                // LOGIN INCORRECTO
                // =========================================

                console.error(
                    "❌ Login rechazado:",
                    resultado
                );


                mostrarError(

                    resultado.error ||
                    "Usuario o contraseña incorrectos."

                );


                restaurarBoton();

            }


            catch (error) {


                clearTimeout(
                    timeout
                );


                console.error(
                    "❌ Error realizando login:",
                    error
                );


                if (
                    error.name ===
                    "AbortError"
                ) {

                    mostrarError(
                        "El servidor tardó demasiado en responder."
                    );

                } else {

                    mostrarError(
                        "No se pudo conectar con el servidor."
                    );
                }


                restaurarBoton();

            }

        }
    );


    // =====================================================
    // OCULTAR ERROR AL ESCRIBIR
    // =====================================================

    usuarioInput.addEventListener(
        "input",
        ocultarMensajes
    );


    passwordInput.addEventListener(
        "input",
        ocultarMensajes
    );


    // =====================================================
    // ERROR ?error=invalid
    // =====================================================

    window.addEventListener(
        "load",
        function() {

            const parametros =
                new URLSearchParams(
                    window.location.search
                );

            const error =
                parametros.get(
                    "error"
                );


            if (
                error === "invalid"
            ) {

                mostrarError(
                    "Usuario o contraseña incorrectos."
                );

            }

        }
    );


    // =====================================================
    // MENSAJE DE CARGA
    // =====================================================

    console.log(
        "🚀 EmotiScan AI Login cargado"
    );

</script>


</body>

</html>
