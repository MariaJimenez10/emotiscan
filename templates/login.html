<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmotiScan - Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
        }

        /* Efecto de burbujas de fondo */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: flotar 15s ease-in-out infinite alternate;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #e94560;
            top: -100px;
            right: -100px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #0f3460;
            bottom: -80px;
            left: -80px;
            animation-delay: -5s;
        }

        @keyframes flotar {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        /* ============================================
           TARJETA PRINCIPAL
           ============================================ */
        .container {
            width: 100%;
            max-width: 420px;
            padding: 45px 40px;
            border-radius: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            color: white;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           LOGO / TÍTULO
           ============================================ */
        .logo-icon {
            font-size: 60px;
            margin-bottom: 10px;
            display: block;
        }

        .container h1 {
            font-size: 30px;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .container .subtitle {
            color: #a8d8ea;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 30px;
            letter-spacing: 1px;
            -webkit-text-fill-color: #a8d8ea;
        }

        /* ============================================
           MENSAJE DE ERROR (INICIALMENTE OCULTO)
           ============================================ */
        #error-message {
            display: none;
            background: rgba(233, 69, 96, 0.15);
            border: 2px solid #e94560;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
            animation: shakeError 0.5s ease;
        }

        #error-message.show {
            display: block;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* ============================================
           CAMPOS DEL FORMULARIO
           ============================================ */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            color: rgb(226, 229, 233);
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 18px 14px 50px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #e94560;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.15);
        }

        .input-wrapper input:focus + i,
        .input-wrapper input:focus ~ i {
            color: #e94560;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-wrapper input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #1a1a2e inset !important;
            -webkit-text-fill-color: #fff !important;
        }

        /* ============================================
           BOTÓN LOGIN
           ============================================ */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e94560, #c73652);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.3);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        .btn-login .spinner.show {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           ENLACE A REGISTRO
           ============================================ */
        .register-link {
            margin-top: 25px;
            color: #a8d8ea;
            font-size: 14px;
        }

        .register-link a {
            color: #e94560;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #ff6b6b;
            text-decoration: underline;
        }

        /* ============================================
           FOOTER
           ============================================ */
        .footer {
            margin-top: 35px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 500px) {
            .container {
                padding: 35px 25px;
            }

            .container h1 {
                font-size: 24px;
            }

            .logo-icon {
                font-size: 45px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
    TARJETA DE LOGIN
    ============================================ -->
    <div class="container">

        <!-- ICONO -->
        <span class="logo-icon">🧠</span>

        <!-- TÍTULO -->
        <h1>EmotiScan AI</h1>
        <p class="subtitle">Reconocimiento Inteligente de Emociones</p>

        <!-- MENSAJE DE ERROR -->
        <div id="error-message">
            ❌ Usuario o contraseña incorrectos
        </div>

        <!-- FORMULARIO -->
        <form id="login-form" action="/login" method="POST">

            <div class="form-group">
                <label for="usuario">
                    <i class="fa-solid fa-user" style="color: rgb(226, 229, 233);"></i> Usuario
                </label>
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        autocomplete="off"
                        required
                    >
                    <i class="fa-solid fa-user" style="color: rgb(226, 229, 233);"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fa-solid fa-lock" style="color: rgb(226, 229, 233);"></i> Contraseña
                </label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="off"
                        required
                    >
                    <i class="fa-solid fa-lock" style="color: rgb(226, 229, 233);"></i>
                </div>
            </div>

            <button type="submit" class="btn-login" id="login-btn">
                <span class="spinner" id="spinner"></span>
                <span id="btn-text">
                    <i class="fa-solid fa-right-to-bracket"></i> Ingresar
                </span>
            </button>

        </form>

        <!-- ENLACE A REGISTRO -->
        <div class="register-link">
            ¿No tienes cuenta? <a href="/register">+ Crear una cuenta</a>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            © 2026 EmotiScan AI
        </div>

    </div>

    <!-- ============================================
    SCRIPTS
    ============================================ -->
    <script>
        // ============================================
        // 1. LIMPIAR CAMPOS AL CARGAR
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('usuario').value = '';
            document.getElementById('password').value = '';
            ocultarError();
            console.log('🧹 Página de login limpiada');
        });

        // ============================================
        // 2. MANEJAR ENVÍO DEL FORMULARIO
        // ============================================
        document.getElementById('login-form').addEventListener('submit', function(e) {
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!usuario || !password) {
                e.preventDefault();
                mostrarError('⚠️ Por favor completa todos los campos');
                return;
            }

            // Mostrar loading
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');

            btn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';
            spinner.classList.add('show');
            ocultarError();
        });

        // ============================================
        // 3. FUNCIONES DE ERROR
        // ============================================
        function mostrarError(mensaje) {
            const errorMsg = document.getElementById('error-message');
            if (mensaje) {
                errorMsg.textContent = '❌ ' + mensaje;
            } else {
                errorMsg.textContent = '❌ Usuario o contraseña incorrectos';
            }
            errorMsg.style.display = 'block';
            void errorMsg.offsetWidth;
            errorMsg.classList.add('show');
        }

        function ocultarError() {
            const errorMsg = document.getElementById('error-message');
            errorMsg.classList.remove('show');
            errorMsg.style.display = 'none';
        }

        // ============================================
        // 4. LIMPIAR ERROR AL ESCRIBIR
        // ============================================
        document.getElementById('usuario').addEventListener('input', ocultarError);
        document.getElementById('password').addEventListener('input', ocultarError);

        // ============================================
        // 5. DETECTAR ERROR DEL SERVIDOR
        // ============================================
        window.addEventListener('load', function() {
            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');

            if (error === 'invalid') {
                mostrarError('Usuario o contraseña incorrectos');
                document.getElementById('usuario').value = '';
                document.getElementById('password').value = '';

                const btn = document.getElementById('login-btn');
                const btnText = document.getElementById('btn-text');
                const spinner = document.getElementById('spinner');
                btn.disabled = false;
                btnText.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Ingresar';
                spinner.classList.remove('show');
            }
        });

        // ============================================
        // 6. TIMEOUT PARA ERROR DE CONEXIÓN
        // ============================================
        document.getElementById('login-form').addEventListener('submit', function(e) {
            const timeoutId = setTimeout(function() {
                const btn = document.getElementById('login-btn');
                const btnText = document.getElementById('btn-text');
                const spinner = document.getElementById('spinner');

                btn.disabled = false;
                btnText.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Ingresar';
                spinner.classList.remove('show');

                mostrarError('Error de conexión. Intenta nuevamente');
            }, 10000);

            window._loginTimeout = timeoutId;
        });

        window.addEventListener('beforeunload', function() {
            if (window._loginTimeout) {
                clearTimeout(window._loginTimeout);
            }
        });

        console.log('🚀 EmotiScan Login cargado correctamente');
        console.log('💡 Los campos están vacíos al inicio');
    </script>

</body>
</html>
