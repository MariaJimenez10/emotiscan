<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmotiScan - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .logo p {
            color: #a8d8ea;
            font-size: 14px;
            margin-top: 5px;
            letter-spacing: 2px;
            -webkit-text-fill-color: #a8d8ea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #e94560;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #1a1a2e inset !important;
            -webkit-text-fill-color: #fff !important;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e94560, #c73652);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.3);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #a8d8ea;
            font-size: 14px;
        }

        .register-link a {
            color: #e94560;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #ff6b6b;
            text-decoration: underline;
        }

        /* ============================================
           MENSAJE DE ERROR (INICIALMENTE OCULTO)
           ============================================ */
        #error-message {
            display: none;
            background: rgba(233, 69, 96, 0.15);
            border: 2px solid #e94560;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
            animation: shakeError 0.5s ease;
        }

        #error-message.show {
            display: block;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .spinner.show {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO -->
        <div class="logo">
            <h1>🧠 EmotiScan AI</h1>
            <p>Reconocimiento Inteligente de Emociones</p>
        </div>

        <!-- MENSAJE DE ERROR (INICIALMENTE OCULTO) -->
        <div id="error-message">
            ❌ Usuario o contraseña incorrectos
        </div>

        <!-- FORMULARIO -->
        <form id="login-form" action="/login" method="POST">
            <div class="form-group">
                <label for="usuario">👤 Usuario</label>
                <input 
                    type="text" 
                    id="usuario" 
                    name="usuario" 
                    placeholder="Ingresa tu usuario"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">🔒 Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Ingresa tu contraseña"
                    autocomplete="off"
                    required
                >
            </div>

            <button type="submit" class="btn-login" id="login-btn">
                <span class="btn-content">
                    <span id="btn-text">Ingresar</span>
                    <span class="spinner" id="spinner"></span>
                </span>
            </button>
        </form>

        <div class="register-link">
            ¿No tienes cuenta? <a href="/register">+ Crear una cuenta</a>
        </div>

        <div class="footer">
            © 2026 EmotiScan AI
        </div>
    </div>

    <script>
        // ============================================
        // 1. LIMPIAR CAMPOS AL CARGAR (SIN DATOS)
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Limpiar campos de texto
            document.getElementById('usuario').value = '';
            document.getElementById('password').value = '';
            
            // Ocultar mensaje de error si existe
            const errorMsg = document.getElementById('error-message');
            errorMsg.classList.remove('show');
            errorMsg.style.display = 'none';
            
            console.log('🧹 Página de login limpiada');
        });

        // ============================================
        // 2. MANEJAR ENVÍO DEL FORMULARIO
        // ============================================
        document.getElementById('login-form').addEventListener('submit', function(e) {
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();
            
            // Validar que los campos no estén vacíos
            if (!usuario || !password) {
                e.preventDefault();
                mostrarError('⚠️ Por favor completa todos los campos');
                return;
            }
            
            // Mostrar loading
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');
            
            btn.disabled = true;
            btnText.textContent = 'Verificando...';
            spinner.classList.add('show');
            
            // Ocultar error anterior
            ocultarError();
            
            // El formulario se envía normalmente
            // Si hay error, el servidor responderá con la página de error
        });

        // ============================================
        // 3. FUNCIONES DE ERROR
        // ============================================
        function mostrarError(mensaje) {
            const errorMsg = document.getElementById('error-message');
            
            // Personalizar mensaje
            if (mensaje) {
                errorMsg.textContent = '❌ ' + mensaje;
            } else {
                errorMsg.textContent = '❌ Usuario o contraseña incorrectos';
            }
            
            // Mostrar con animación
            errorMsg.style.display = 'block';
            // Forzar reflow para reiniciar animación
            void errorMsg.offsetWidth;
            errorMsg.classList.add('show');
        }

        function ocultarError() {
            const errorMsg = document.getElementById('error-message');
            errorMsg.classList.remove('show');
            errorMsg.style.display = 'none';
        }

        // ============================================
        // 4. DETECTAR ERRORES DEL SERVIDOR
        // ============================================
        // Si la página se carga con un mensaje de error
        // (por ejemplo, después de un login fallido)
        window.addEventListener('load', function() {
            // Verificar si hay parámetros de error en la URL
            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');
            
            if (error === 'invalid') {
                mostrarError('Usuario o contraseña incorrectos');
                
                // Limpiar campos
                document.getElementById('usuario').value = '';
                document.getElementById('password').value = '';
                
                // Restaurar botón
                const btn = document.getElementById('login-btn');
                const btnText = document.getElementById('btn-text');
                const spinner = document.getElementById('spinner');
                btn.disabled = false;
                btnText.textContent = 'Ingresar';
                spinner.classList.remove('show');
            }
            
            // Si hay un mensaje de error en el HTML (por ejemplo, desde Flask)
            const errorElement = document.querySelector('.error-message');
            if (errorElement) {
                mostrarError(errorElement.textContent);
                errorElement.remove();
            }
        });

        // ============================================
        // 5. LIMPIAR ERROR AL ESCRIBIR
        // ============================================
        document.getElementById('usuario').addEventListener('input', function() {
            ocultarError();
        });
        
        document.getElementById('password').addEventListener('input', function() {
            ocultarError();
        });

        // ============================================
        // 6. MANEJAR ERRORES DE RED
        // ============================================
        // Si el servidor no responde, mostrar error
        document.getElementById('login-form').addEventListener('submit', function(e) {
            // Timeout para detectar si el servidor no responde
            const timeoutId = setTimeout(function() {
                const btn = document.getElementById('login-btn');
                const btnText = document.getElementById('btn-text');
                const spinner = document.getElementById('spinner');
                
                btn.disabled = false;
                btnText.textContent = 'Ingresar';
                spinner.classList.remove('show');
                
                mostrarError('Error de conexión. Intenta nuevamente');
            }, 10000); // 10 segundos de timeout
            
            // Guardar timeout para limpiarlo si la navegación ocurre
            window._loginTimeout = timeoutId;
        });

        // Limpiar timeout al navegar
        window.addEventListener('beforeunload', function() {
            if (window._loginTimeout) {
                clearTimeout(window._loginTimeout);
            }
        });

        console.log('🚀 EmotiScan Login cargado correctamente');
        console.log('💡 Los campos están vacíos al inicio');
    </script>

</body>
</html>
