<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EmotiScan - Iniciar sesión</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #273469 0%,
                    #1a1a2e 45%,
                    #0f0f1f 100%
                );

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }

        .contenedor {

            width: 100%;

            max-width: 450px;

            background:
                rgba(22, 33, 62, 0.97);

            padding: 40px;

            border-radius: 25px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.45);

        }

        .logo {

            width: 80px;

            height: 80px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #e94560,
                    #8e44ad
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

        }

        h1 {

            text-align: center;

            margin: 10px 0;

            font-size: 34px;

        }

        .subtitulo {

            text-align: center;

            color: #a8d8ea;

            margin-bottom: 30px;

        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border: none;

            border-radius: 10px;

            background: #0f3460;

            color: white;

            font-size: 16px;

            outline: none;

        }

        input::placeholder {

            color: #a9b3c6;

        }

        input:focus {

            outline: 2px solid #e94560;

        }

        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #e94560,
                    #c73652
                );

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }

        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(233, 69, 96, 0.4);

        }

        .mensaje {

            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            display: none;

        }

        .error {

            background:
                rgba(255, 70, 70, 0.15);

            color: #ff8080;

        }

        .exito {

            background:
                rgba(70, 200, 120, 0.15);

            color: #70e0a0;

        }

        .links {

            text-align: center;

            margin-top: 25px;

            color: #a8a8bb;

        }

        .links a {

            color: #a8d8ea;

            text-decoration: none;

            font-weight: bold;

        }

        .links a:hover {

            text-decoration: underline;

        }

        .volver {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #888;

            text-decoration: none;

            font-size: 14px;

        }

        .volver:hover {

            color: white;

        }

        @media (max-width: 500px) {

            .contenedor {

                padding: 30px 20px;

            }

        }

    </style>

</head>


<body>


<div class="contenedor">


    <div class="logo">

        🧠

    </div>


    <h1>

        Iniciar sesión

    </h1>


    <div class="subtitulo">

        Accede a tu cuenta de EmotiScan

    </div>


    <form id="loginForm">


        <label for="email">

            Correo electrónico

        </label>

        <input
            type="email"
            id="email"
            placeholder="ejemplo@correo.com"
            required
        >


        <label for="password">

            Contraseña

        </label>

        <input
            type="password"
            id="password"
            placeholder="Ingresa tu contraseña"
            required
        >


        <button type="submit">

            🔐 Iniciar sesión

        </button>


    </form>


    <div
        id="mensaje"
        class="mensaje"
    ></div>


    <div class="links">

        ¿No tienes una cuenta?

        <a href="/registro">

            Regístrate

        </a>

    </div>


    <a
        href="/"
        class="volver"
    >

        ← Volver al inicio

    </a>


</div>


<script>

    const formulario =
        document.getElementById(
            "loginForm"
        );


    const mensaje =
        document.getElementById(
            "mensaje"
        );


    formulario.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            mensaje.style.display =
                "none";


            try {

                const respuesta =
                    await fetch(
                        "/login",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                email: email,

                                password: password

                            })

                        }
                    );


                const resultado =
                    await respuesta.json();


                if (
                    resultado.success
                ) {

                    mensaje.className =
                        "mensaje exito";

                    mensaje.textContent =
                        "✅ Inicio de sesión exitoso. Bienvenido/a " +
                        resultado.nombre +
                        "...";

                    mensaje.style.display =
                        "block";


                    setTimeout(
                        function() {

                            window.location.href =
                                resultado.redirect ||
                                "/inicio";

                        },
                        1000
                    );


                } else {

                    mensaje.className =
                        "mensaje error";

                    mensaje.textContent =
                        "❌ " +
                        (
                            resultado.error ||
                            "Correo o contraseña incorrectos."
                        );

                    mensaje.style.display =
                        "block";

                }


            } catch (error) {

                console.error(
                    error
                );


                mensaje.className =
                    "mensaje error";

                mensaje.textContent =
                    "❌ No se pudo conectar con el servidor.";

                mensaje.style.display =
                    "block";

            }

        }
    );

</script>


</body>

</html>
