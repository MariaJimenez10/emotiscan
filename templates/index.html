<!DOCTYPE html>
<html>
<head>
    <title>EmotiScan - Cámara</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #16213e;
            padding: 20px;
            border-radius: 15px;
        }
        video, #canvas {
            width: 100%;
            max-width: 640px;
            border-radius: 10px;
            border: 2px solid #0f3460;
        }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        button:hover {
            transform: scale(1.05);
            background: #c73652;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #result {
            margin: 20px;
            padding: 20px;
            background: #0f3460;
            border-radius: 10px;
            min-height: 100px;
        }
        .emocion {
            font-size: 48px;
            font-weight: bold;
        }
        .mensaje {
            font-size: 24px;
            margin: 10px 0;
            color: #ffd700;
        }
        .consejo {
            font-size: 18px;
            color: #a8d8ea;
        }
        #status {
            padding: 10px;
            background: #1a1a2e;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        .loading {
            display: none;
            color: #ffd700;
            font-size: 20px;
        }
        #contador {
            color: #aaa;
            font-size: 14px;
            margin-top: 10px;
        }
        .error {
            color: #ff6b6b;
        }
        .success {
            color: #51cf66;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 EmotiScan - Análisis de Emociones</h1>
        
        <div id="status">⏳ Iniciando cámara...</div>
        
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        
        <div>
            <button id="captureBtn">📷 Capturar y Analizar</button>
            <button id="autoBtn">🔄 Modo Automático</button>
            <button id="stopBtn">⏹️ Detener</button>
        </div>
        
        <div id="contador">📊 Capturas: 0</div>
        
        <div id="result">
            <div class="loading" id="loading">⏳ Procesando...</div>
            <div id="emocionDisplay">🤖 Presiona "Capturar" para analizar</div>
        </div>
        
        <a href="/inicio" style="color: #a8d8ea; display: block; margin-top: 20px;">← Volver al inicio</a>
    </div>

    <script>
        // ============================================
        // ELEMENTOS DEL DOM
        // ============================================
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const autoBtn = document.getElementById('autoBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resultDiv = document.getElementById('result');
        const emocionDisplay = document.getElementById('emocionDisplay');
        const loadingDiv = document.getElementById('loading');
        const statusDiv = document.getElementById('status');
        const contadorDiv = document.getElementById('contador');

        // ============================================
        // VARIABLES DE CONTROL
        // ============================================
        let stream = null;
        let isCameraRunning = false;
        let isAutoMode = false;
        let autoInterval = null;
        let capturas = 0;
        let isProcessing = false;

        // ============================================
        // FACE MESH - PARA LA MALLA FACIAL
        // ============================================
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(results => {
            // Limpiar y dibujar la imagen del video
            ctxOverlay.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);
            ctxOverlay.save();
            ctxOverlay.scale(-1, 1);
            ctxOverlay.drawImage(results.image, -canvasOverlay.width, 0, canvasOverlay.width, canvasOverlay.height);
            ctxOverlay.restore();

            // === DIBUJAR MALLA FACIAL AZUL ===
            if (results.multiFaceLandmarks) {
                for (const landmarks of results.multiFaceLandmarks) {
                    // Aplicar espejo a los landmarks
                    const mirroredLandmarks = landmarks.map(lm => ({
                        x: 1 - lm.x,
                        y: lm.y,
                        z: lm.z
                    }));

                    // 1. MALLA PRINCIPAL (triangulación) - azul claro
                    drawConnectors(ctxOverlay, mirroredLandmarks, FACEMESH_TESSELATION, {
                        color: "rgba(0, 150, 255, 0.25)",
                        lineWidth: 0.8
                    });

                    // 2. OJOS - azul más brillante
                    drawConnectors(ctxOverlay, mirroredLandmarks, FACEMESH_RIGHT_EYE, {
                        color: "rgba(0, 200, 255, 0.7)",
                        lineWidth: 1.8
                    });
                    drawConnectors(ctxOverlay, mirroredLandmarks, FACEMESH_LEFT_EYE, {
                        color: "rgba(0, 200, 255, 0.7)",
                        lineWidth: 1.8
                    });

                    // 3. LABIOS - azul más brillante
                    drawConnectors(ctxOverlay, mirroredLandmarks, FACEMESH_LIPS, {
                        color: "rgba(0, 200, 255, 0.7)",
                        lineWidth: 1.8
                    });

                    // 4. PUNTOS DE LA CARA (pequeños círculos azules)
                    for (const lm of mirroredLandmarks) {
                        const x = lm.x * canvasOverlay.width;
                        const y = lm.y * canvasOverlay.height;
                        ctxOverlay.beginPath();
                        ctxOverlay.arc(x, y, 2, 0, 2 * Math.PI);
                        ctxOverlay.fillStyle = "rgba(0, 180, 255, 0.6)";
                        ctxOverlay.fill();
                    }
                }
                scanIndicator.classList.add('active');
            } else {
                scanIndicator.classList.remove('active');
            }
        });

        // ============================================
        // FUNCIÓN: INICIAR CÁMARA
        // ============================================
        async function startCamera() {
            try {
                statusDiv.textContent = '📷 Solicitando acceso a la cámara...';
                statusDiv.className = '';
                
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                await video.play();
                isCameraRunning = true;
                
                captureBtn.disabled = false;
                autoBtn.disabled = false;
                stopBtn.disabled = false;
                
                statusDiv.textContent = '🟢 Cámara activa - Listo para capturar';
                statusDiv.className = 'success';
                
                console.log('✅ Cámara iniciada correctamente');
                
                // Mostrar dimensiones del video
                console.log(`📐 Video: ${video.videoWidth}x${video.videoHeight}`);
                
            } catch (error) {
                console.error('❌ Error al iniciar cámara:', error);
                statusDiv.textContent = '❌ Error: ' + error.message;
                statusDiv.className = 'error';
                
                // Mensaje amigable para el usuario
                let mensaje = 'No se pudo acceder a la cámara. ';
                if (error.name === 'NotAllowedError') {
                    mensaje += 'Permite el acceso en la configuración del navegador.';
                } else if (error.name === 'NotFoundError') {
                    mensaje += 'No se encontró una cámara en tu dispositivo.';
                } else {
                    mensaje += 'Verifica que tu cámara esté conectada.';
                }
                alert(mensaje);
            }
        }

        // ============================================
        // FUNCIÓN: CAPTURAR Y ANALIZAR
        // ============================================
        async function captureAndAnalyze() {
            // Evitar múltiples capturas simultáneas
            if (isProcessing) {
                console.log('⏳ Ya hay un proceso en curso...');
                return;
            }
            
            if (!isCameraRunning) {
                alert('Primero inicia la cámara');
                return;
            }

            try {
                isProcessing = true;
                captureBtn.disabled = true;
                autoBtn.disabled = true;
                
                // Mostrar loading
                loadingDiv.style.display = 'block';
                emocionDisplay.textContent = '⏳ Analizando...';
                statusDiv.textContent = '⏳ Procesando imagen...';
                
                // ============================================
                // 1. CAPTURAR IMAGEN DEL VIDEO
                // ============================================
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                console.log(`📸 Captura realizada: ${canvas.width}x${canvas.height}`);
                
                // ============================================
                // 2. CONVERTIR A BASE64
                // ============================================
                const imageData = canvas.toDataURL('image/jpeg', 0.9);
                
                // ============================================
                // 3. ENVIAR AL SERVIDOR
                // ============================================
                console.log('📤 Enviando al servidor...');
                
                const response = await fetch('/analizar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: imageData
                    })
                });

                console.log(`📥 Respuesta: ${response.status}`);
                
                // ============================================
                // 4. PROCESAR RESPUESTA
                // ============================================
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                console.log('📊 Datos recibidos:', data);

                if (data.success) {
                    // Incrementar contador
                    capturas++;
                    contadorDiv.textContent = `📊 Capturas: ${capturas}`;
                    
                    // Mostrar resultado
                    emocionDisplay.innerHTML = `
                        <div class="emocion">${data.emotion}</div>
                        <div class="mensaje">💬 ${data.message || 'Mensaje no disponible'}</div>
                        <div class="consejo">💡 ${data.advice || 'Cuida de ti mismo'}</div>
                    `;
                    statusDiv.textContent = '✅ Análisis completado';
                    statusDiv.className = 'success';
                    
                    console.log(`🎯 Emoción detectada: ${data.emotion}`);
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }
                
            } catch (error) {
                console.error('❌ Error en captureAndAnalyze:', error);
                emocionDisplay.innerHTML = `
                    <div class="error">
                        ❌ Error: ${error.message}
                    </div>
                `;
                statusDiv.textContent = '❌ Error en el análisis';
                statusDiv.className = 'error';
            } finally {
                // Restaurar UI
                loadingDiv.style.display = 'none';
                isProcessing = false;
                captureBtn.disabled = false;
                autoBtn.disabled = false;
                
                // Restaurar estado después de 2 segundos
                setTimeout(() => {
                    if (!isProcessing && isCameraRunning) {
                        statusDiv.textContent = '🟢 Cámara activa - Listo para capturar';
                        statusDiv.className = 'success';
                    }
                }, 2000);
            }
        }

        // ============================================
        // FUNCIÓN: MODO AUTOMÁTICO
        // ============================================
        function toggleAutoMode() {
            if (isAutoMode) {
                // Detener modo automático
                isAutoMode = false;
                if (autoInterval) {
                    clearInterval(autoInterval);
                    autoInterval = null;
                }
                autoBtn.textContent = '🔄 Modo Automático';
                statusDiv.textContent = '⏸️ Modo automático detenido';
                console.log('⏸️ Modo automático detenido');
            } else {
                // Iniciar modo automático
                isAutoMode = true;
                autoBtn.textContent = '⏹️ Detener Automático';
                statusDiv.textContent = '🔄 Modo automático activo - Capturando cada 3 segundos';
                console.log('🔄 Modo automático iniciado');
                
                // Capturar inmediatamente
                captureAndAnalyze();
                
                // Configurar intervalo
                autoInterval = setInterval(() => {
                    if (isCameraRunning && !isProcessing) {
                        captureAndAnalyze();
                    }
                }, 3000); // Cada 3 segundos
            }
        }

        // ============================================
        // FUNCIÓN: DETENER CÁMARA
        // ============================================
        function stopCamera() {
            // Detener modo automático
            if (isAutoMode) {
                toggleAutoMode();
            }
            
            // Detener stream
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            video.srcObject = null;
            isCameraRunning = false;
            
            captureBtn.disabled = true;
            autoBtn.disabled = true;
            stopBtn.disabled = true;
            
            statusDiv.textContent = '⏹️ Cámara detenida';
            statusDiv.className = '';
            
            console.log('⏹️ Cámara detenida');
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        captureBtn.addEventListener('click', captureAndAnalyze);
        autoBtn.addEventListener('click', toggleAutoMode);
        stopBtn.addEventListener('click', stopCamera);

        // ============================================
        // INICIALIZAR
        // ============================================
        window.onload = function() {
            console.log('🚀 Iniciando EmotiScan...');
            console.log(`📱 Navegador: ${navigator.userAgent}`);
            startCamera();
        };

        // Limpiar al cerrar
        window.addEventListener('beforeunload', function() {
            if (autoInterval) {
                clearInterval(autoInterval);
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            console.log('🧹 Recursos liberados');
        });

        // Manejar errores de la cámara
        video.addEventListener('error', function(e) {
            console.error('❌ Error en video:', e);
            statusDiv.textContent = '❌ Error en el stream de video';
            statusDiv.className = 'error';
        });

        // Tecla Espacio para capturar
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                if (!isProcessing && isCameraRunning) {
                    captureAndAnalyze();
                }
            }
        });

        console.log('✅ EmotiScan cargado correctamente');
        console.log('💡 Presiona ESPACIO para capturar rápidamente');
    </script>
</body>
</html>
