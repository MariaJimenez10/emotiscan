<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmotiScan - Camara</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #6366f1;
            --secondary: #ec4899;
            --accent: #f59e0b;
            --success: #10b981;
            --error: #ef4444;
            --text: #f8fafc;
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--bg-card);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 { margin: 0; font-size: 2rem; background: linear-gradient(to right, #818cf8, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h2 { font-weight: 300; color: #94a3b8; margin-bottom: 20px; font-size: 1.1rem; }

        /* --- Cámara --- */
        .camera-box {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #334155;
            background: #000;
        }

        video { width: 100%; display: block; }
        
        .flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none;
        }
        .flash.active { animation: flash-anim 0.3s; }
        @keyframes flash-anim { 0% { opacity: 0.8; } 100% { opacity: 0; } }

        /* --- Controles --- */
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #4f46e5; transform: translateY(-2px); }
        
        .btn-auto { background: var(--secondary); color: white; }
        .btn-stop { background: #475569; color: white; }
        .btn-stats { background: transparent; border: 2px solid #475569; color: white; }

        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

        /* --- Info --- */
        #status { font-size: 0.9rem; margin-bottom: 15px; padding: 8px; border-radius: 8px; }
        .status-ready { color: var(--success); }
        .status-error { color: var(--error); }

        .stats-bar { display: flex; justify-content: space-around; background: #0f172a; padding: 10px; border-radius: 12px; margin-bottom: 20px; font-size: 0.9rem; }

        /* --- Resultados --- */
        #result {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 20px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .emotion-card { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .emoji-large { font-size: 4rem; margin-bottom: 10px; display: block; }
        .emotion-name { font-size: 1.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); }
        .confidence { font-size: 1rem; color: #94a3b8; margin-top: 5px; }

        .advice-box { margin-top: 15px; padding: 15px; background: rgba(99, 102, 241, 0.1); border-left: 4px solid var(--primary); border-radius: 8px; text-align: left; max-width: 500px; }

        /* --- Gráfica --- */
        #chartContainer {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #0f172a;
            border-radius: 16px;
        }

        .pie-chart {
            width: 200px; height: 200px; border-radius: 50%; margin: 20px auto;
            background: conic-gradient(#ef4444 0% 25%, #f59e0b 25% 50%, #94a3b8 50% 75%, #3b82f6 75% 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
        .dot { width: 12px; height: 12px; border-radius: 3px; }

        @media (max-width: 600px) {
            .controls button { width: 100%; }
            .legend { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📸 EmotiScan Pro</h1>
    <h2>Inteligencia Artificial de Reconocimiento Facial</h2>

    <div id="status">⏳ Iniciando sistema...</div>

    <div class="camera-box">
        <video id="video" autoplay playsinline></video>
        <div id="flash" class="flash"></div>
    </div>

    <div class="stats-bar">
        <span>📊 Capturas: <strong id="count">0</strong></span>
        <span>⏱️ Modo: <strong id="modeText">Manual</strong></span>
    </div>

    <div class="controls">
        <button id="captureBtn" class="btn-primary" disabled>📷 Analizar Rostro</button>
        <button id="autoBtn" class="btn-auto" disabled>🔄 Auto-Modo</button>
        <button id="stopBtn" class="btn-stop" disabled>⏹️ Detener</button>
        <button id="chartBtn" class="btn-stats" disabled>📊 Estadísticas</button>
    </div>

    <div id="result">
        <div id="placeholder">Esperando captura...</div>
    </div>

    <!-- Contenedor de Gráfica -->
    <div id="chartContainer">
        <h3>Distribución de Emociones Detectadas</h3>
        <div id="pieChart" class="pie-chart"></div>
        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:#ef4444"></span> Furia: <span id="p-furia">0%</span></div>
            <div class="legend-item"><span class="dot" style="background:#f59e0b"></span> Felicidad: <span id="p-felicidad">0%</span></div>
            <div class="legend-item"><span class="dot" style="background:#94a3b8"></span> Neutral: <span id="p-neutral">0%</span></div>
            <div class="legend-item"><span class="dot" style="background:#3b82f6"></span> Tristeza: <span id="p-tristeza">0%</span></div>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>
    <a href="/" style="color: #94a3b8; text-decoration: none; display: block; margin-top: 30px; font-size: 0.9rem;">← Salir del sistema</a>
</div>

<script>
    // --- Configuración y Estado ---
    const CONFIG = {
        intervaloAuto: 3000,
        endpoint: '/analizar',
        emociones: {
            'Felicidad': { emoji: '😊', color: '#f59e0b', consejos: ['¡Sigue así! Tu energía es contagiosa.', 'Aprovecha este momento para crear algo nuevo.'] },
            'Tristeza': { emoji: '😢', color: '#3b82f6', consejos: ['Está bien no estar bien. Tómate un respiro.', 'Escuchar música tranquila podría ayudarte.'] },
            'Enojo': { emoji: '😡', color: '#ef4444', consejos: ['Inhala profundamente por 4 segundos.', 'Un pequeño paseo te ayudará a despejarte.'] },
            'Neutral': { emoji: '😐', color: '#94a3b8', consejos: ['Un momento de calma ideal para concentrarse.', '¿Has tomado agua hoy?'] }
        }
    };

    let state = {
        stream: null,
        isProcessing: false,
        isAuto: false,
        autoTimer: null,
        capturas: 0,
        stats: { 'Enojo': 0, 'Felicidad': 0, 'Neutral': 0, 'Tristeza': 0 }
    };

    // --- Elementos DOM ---
    const elements = {
        video: document.getElementById('video'),
        canvas: document.getElementById('canvas'),
        status: document.getElementById('status'),
        result: document.getElementById('result'),
        count: document.getElementById('count'),
        flash: document.getElementById('flash'),
        btns: {
            capture: document.getElementById('captureBtn'),
            auto: document.getElementById('autoBtn'),
            stop: document.getElementById('stopBtn'),
            chart: document.getElementById('chartBtn')
        }
    };

    // --- Funciones de Cámara ---
    async function initCamera() {
        try {
            state.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
            elements.video.srcObject = state.stream;
            elements.status.textContent = '🟢 Sistema Listo';
            elements.status.className = 'status-ready';
            Object.values(elements.btns).forEach(btn => btn.disabled = false);
        } catch (err) {
            elements.status.textContent = '❌ Error: No se detectó cámara';
            elements.status.className = 'status-error';
            alert('Por favor, permite el acceso a la cámara.');
        }
    }

    // --- Lógica Principal ---
    async function captureAndAnalyze() {
        if (state.isProcessing) return;
        
        state.isProcessing = true;
        elements.status.textContent = '⏳ Analizando...';
        
        // Efecto Flash
        elements.flash.classList.add('active');
        setTimeout(() => elements.flash.classList.remove('active'), 300);

        // Captura de imagen
        const ctx = elements.canvas.getContext('2d');
        elements.canvas.width = elements.video.videoWidth;
        elements.canvas.height = elements.video.videoHeight;
        ctx.drawImage(elements.video, 0, 0);
        
        const base64Image = elements.canvas.toDataURL('image/jpeg', 0.8);

        try {
            const response = await fetch(CONFIG.endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image })
            });

            const data = await response.json();

            if (data.success) {
                updateUI(data);
            } else {
                throw new Error(data.error || 'Fallo en el análisis');
            }
        } catch (err) {
            elements.result.innerHTML = `<div class="status-error">❌ Error: \${err.message}</div>`;
        } finally {
            state.isProcessing = false;
            if (!state.isAuto) elements.status.textContent = '🟢 Listo';
        }
    }

    function updateUI(data) {
        state.capturas++;
        elements.count.textContent = state.capturas;

        const emo = data.emotion || 'Neutral';
        const config = CONFIG.emociones[emo] || CONFIG.emociones['Neutral'];
        const consejo = config.consejos[Math.floor(Math.random() * config.consejos.length)];

        // Actualizar Estadísticas locales
        state.stats[emo] = (state.stats[emo] || 0) + 1;
        updateChart();

        elements.result.innerHTML = `
            <div class="emotion-card">
                <span class="emoji-large">${config.emoji}</span>
                <div class="emotion-name">${emo}</div>
                <div class="confidence">Confianza: \${(data.confidence || 0).toFixed(1)}%</div>
                <div class="advice-box">
                    <strong>💡 Consejo:</strong><br>${consejo}
                </div>
            </div>
        `;
    }

    function updateChart() {
        const total = Object.values(state.stats).reduce((a, b) => a + b, 0);
        const getP = (val) => ((val / total) * 100).toFixed(1);

        const p = {
            f: (state.stats['Enojo'] / total) * 100,
            h: (state.stats['Felicidad'] / total) * 100,
            n: (state.stats['Neutral'] / total) * 100,
            t: (state.stats['Tristeza'] / total) * 100
        };

        document.getElementById('p-furia').textContent = getP(state.stats['Enojo']) + '%';
        document.getElementById('p-felicidad').textContent = getP(state.stats['Felicidad']) + '%';
        document.getElementById('p-neutral').textContent = getP(state.stats['Neutral']) + '%';
        document.getElementById('p-tristeza').textContent = getP(state.stats['Tristeza']) + '%';

        elements.btns.chart.disabled = false;

        // Actualizar gradiente de la gráfica
        document.getElementById('pieChart').style.background = `
            conic-gradient(
                #ef4444 0% \${p.f}%, 
                #f59e0b \${p.f}% \${p.f + p.h}%, 
                #94a3b8 \${p.f + p.h}% \${p.f + p.h + p.n}%, 
                #3b82f6 \${p.f + p.h + p.n}% 100%
            )
        `;
    }

    // --- Handlers ---
    elements.btns.capture.onclick = captureAndAnalyze;

    elements.btns.auto.onclick = () => {
        state.isAuto = !state.isAuto;
        if (state.isAuto) {
            elements.btns.auto.textContent = '⏹️ Detener Auto';
            elements.btns.auto.style.background = '#f87171';
            document.getElementById('modeText').textContent = 'Automático';
            captureAndAnalyze();
            state.autoTimer = setInterval(captureAndAnalyze, CONFIG.intervaloAuto);
        } else {
            clearInterval(state.autoTimer);
            elements.btns.auto.textContent = '🔄 Auto-Modo';
            elements.btns.auto.style.background = 'var(--secondary)';
            document.getElementById('modeText').textContent = 'Manual';
        }
    };

    elements.btns.stop.onclick = () => {
        if (state.stream) {
            state.stream.getTracks().forEach(t => t.stop());
            elements.video.srcObject = null;
            elements.status.textContent = '⏹️ Cámara Apagada';
            Object.values(elements.btns).forEach(btn => btn.disabled = true);
        }
    };

    elements.btns.chart.onclick = () => {
        const container = document.getElementById('chartContainer');
        const isVisible = container.style.display === 'block';
        container.style.display = isVisible ? 'none' : 'block';
        elements.btns.chart.textContent = isVisible ? '📊 Ver Estadísticas' : '📊 Ocultar Gráfica';
    };

    // Tecla Espacio para capturar
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !state.isProcessing && state.stream) {
            e.preventDefault();
            captureAndAnalyze();
        }
    });

    // Inicio
    window.onload = initCamera;
</script>

</body>
</html>
