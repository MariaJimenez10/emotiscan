<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmotiScan - Cámara</title>
    <style>
        /* =====================================================
           GENERAL
           ===================================================== */
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #16213e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        h1 { margin-bottom: 5px; color: #fff; }
        h2 { margin-top: 5px; color: #a8d8ea; font-weight: 300; }

        /* =====================================================
           VIDEO Y CANVAS
           ===================================================== */
        .video-container {
            position: relative;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            max-width: 640px;
            border-radius: 10px;
            border: 2px solid #0f3460;
            background: black;
            transform: scaleX(-1); /* Efecto espejo */
        }

        /* =====================================================
           BOTONES
           ===================================================== */
        .controls { margin: 20px 0; }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        button:hover { transform: scale(1.05); background: #c73652; }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        #graficaBtn { background: #0f3460; border: 1px solid #a8d8ea; }

        /* =====================================================
           ESTADO Y RESULTADOS
           ===================================================== */
        #status {
            padding: 10px;
            background: #1a1a2e;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 14px;
        }
        .success { color: #51cf66; }
        .error { color: #ff6b6b; }
        #contador { color: #aaa; font-size: 14px; margin-bottom: 10px; }

        #result {
            margin-top: 20px;
            padding: 20px;
            background: #0f3460;
            border-radius: 10px;
            min-height: 100px;
        }
        .loading { display: none; color: #ffd700; font-size: 18px; margin-bottom: 10px; }

        /* Estilos de Emoción Detectada */
        .emocion-detectada {
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 15px;
            background: rgba(255, 215, 0, 0.05);
            animation: aparecer 0.5s ease;
        }
        .emoji-grande { font-size: 60px; display: block; }
        .emocion-principal { font-size: 40px; font-weight: bold; text-transform: uppercase; margin: 10px 0; }
        .confianza { font-size: 18px; }
        .confianza strong { color: #ffd700; font-size: 24px; }
        .consejo {
            margin-top: 15px;
            padding: 15px;
            background: #16213e;
            border-left: 4px solid #ffd700;
            text-align: left;
            font-style: italic;
            color: #a8d8ea;
        }

        /* =====================================================
           GRÁFICA
           ===================================================== */
        #graficaContainer {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #0f3460;
            border-radius: 15px;
        }
        #graficaCircular {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: conic-gradient(#95a5a6 0deg 360deg);
            transition: background 0.5s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .leyenda {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
        }
        .item-leyenda { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 5px; }
        .color-box { width: 12px; height: 12px; border-radius: 50%; }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>EmotiScan</h1>
    <h2>Análisis de Emociones en Tiempo Real</h2>

    <div id="status">Iniciando sistema...</div>
    <div id="contador">Capturas realizadas: 0</div>

    <div class="video-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display: none;"></canvas>
    </div>

    <div class="controls">
        <button id="captureBtn" disabled>📷 Capturar</button>
        <button id="autoBtn" disabled>🔄 Modo Automático</button>
        <button id="stopBtn" disabled>⏹️ Detener</button>
        <button id="graficaBtn" disabled>📊 Ver Gráfica</button>
    </div>

    <div id="result">
        <div class="loading" id="loading">⏳ Procesando imagen...</div>
        <div id="emocionDisplay">🤖 Presiona "Capturar" para comenzar</div>
    </div>

    <div id="graficaContainer">
        <h3>Distribución de Emociones</h3>
        <div id="graficaCircular"></div>
        <div class="leyenda">
            <div class="item-leyenda"><span class="color-box" style="background:#e74c3c"></span> Furia: <strong id="p-enojo">0%</strong></div>
            <div class="item-leyenda"><span class="color-box" style="background:#f1c40f"></span> Felicidad: <strong id="p-felicidad">0%</strong></div>
            <div class="item-leyenda"><span class="color-box" style="background:#95a5a6"></span> Neutral: <strong id="p-neutral">0%</strong></div>
            <div class="item-leyenda"><span class="color-box" style="background:#3498db"></span> Tristeza: <strong id="p-tristeza">0%</strong></div>
        </div>
    </div>

    <a href="/" style="color: #a8d8ea; display: block; margin-top: 20px; text-decoration: none;">← Volver al inicio</a>
</div>

<script>
    // ELEMENTOS
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const autoBtn = document.getElementById('autoBtn');
    const stopBtn = document.getElementById('stopBtn');
    const graficaBtn = document.getElementById('graficaBtn');
    const statusDiv = document.getElementById('status');
    const emocionDisplay = document.getElementById('emocionDisplay');
    const loadingDiv = document.getElementById('loading');
    const contadorDiv = document.getElementById('contador');

    // VARIABLES
    let stream = null;
    let isCameraRunning = false;
    let isAutoMode = false;
    let autoInterval = null;
    let isProcessing = false;
    let capturas = 0;
    let datosGrafica = { enojo: 0, felicidad: 0, neutral: 0, tristeza: 0 };

    const consejos = {
        "Felicidad": ["✨ Disfruta este momento y comparte tu energía.", "😊 Sonreír mejora tu salud y la de los demás."],
        "Tristeza": ["💙 Está bien no estar bien. Tómate un respiro.", "🌱 Mañana será un nuevo día. Sé amable contigo."],
        "Enojo": ["🧘 Respira profundo. Cuenta hasta diez antes de actuar.", "🚶 Una caminata corta te ayudará a despejar la mente."],
        "Neutral": ["😌 Un estado de calma es ideal para concentrarse.", "🎯 Aprovecha este equilibrio para avanzar en tus metas."]
    };

    // INICIAR CÁMARA
    async function startCamera() {
        try {
            statusDiv.textContent = '📷 Solicitando acceso...';
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 640, height: 480 }, 
                audio: false 
            });
            video.srcObject = stream;
            isCameraRunning = true;
            
            captureBtn.disabled = false;
            autoBtn.disabled = false;
            stopBtn.disabled = false;
            
            statusDiv.textContent = '🟢 Cámara activa';
            statusDiv.className = 'success';
        } catch (err) {
            statusDiv.textContent = '❌ Error: ' + err.message;
            statusDiv.className = 'error';
        }
    }

    // ANALIZAR
    async function captureAndAnalyze() {
        if (isProcessing || !isCameraRunning) return;

        try {
            isProcessing = true;
            loadingDiv.style.display = 'block';
            statusDiv.textContent = '⏳ Analizando...';

            // Captura
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imageData = canvas.toDataURL('image/jpeg', 0.8);

            const response = await fetch('/analizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            });

            const data = await response.json();

            if (data.success) {
                capturas++;
                contadorDiv.textContent = `Capturas realizadas: \${capturas}`;
                actualizarUI(data);
                graficaBtn.disabled = false;
            } else {
                throw new Error(data.error || 'Error en análisis');
            }
        } catch (err) {
            emocionDisplay.innerHTML = `<div class="error">❌ \${err.message}</div>`;
        } finally {
            isProcessing = false;
            loadingDiv.style.display = 'none';
            statusDiv.textContent = '🟢 Listo';
        }
    }

    function actualizarUI(data) {
        const emocion = data.emotion || "Neutral";
        const confianza = data.confidence || 0;
        const emoji = { "Felicidad": "😊", "Tristeza": "😢", "Enojo": "😡", "Neutral": "😐" }[emocion] || "🤖";
        const listaConsejos = consejos[emocion] || ["Mantente atento a tus emociones."];
        const consejo = listaConsejos[Math.floor(Math.random() * listaConsejos.length)];

        emocionDisplay.innerHTML = `
            <div class="emocion-detectada">
                <span class="emoji-grande">${emoji}</span>
                <div class="emocion-principal">${emocion === 'Enojo' ? 'Furia' : emocion}</div>
                <div class="confianza">Confianza: <strong>${confianza.toFixed(1)}%</strong></div>
            </div>
            <div class="consejo"><strong>💡 Consejo:</strong> \${consejo}</div>
        `;

        // Actualizar datos para gráfica (si el backend envía el desglose)
        if (data.all_emotions) {
            datosGrafica = {
                enojo: data.all_emotions.Enojo || 0,
                felicidad: data.all_emotions.Felicidad || 0,
                neutral: data.all_emotions.Neutral || 0,
                tristeza: data.all_emotions.Tristeza || 0
            };
            if (document.getElementById('graficaContainer').style.display === 'block') {
                actualizarGrafica();
            }
        }
    }

    function actualizarGrafica() {
        const { enojo, felicidad, neutral, tristeza } = datosGrafica;
        const total = enojo + felicidad + neutral + tristeza || 1;
        
        const gEnojo = (enojo / total) * 360;
        const gFeli = (felicidad / total) * 360;
        const gNeu = (neutral / total) * 360;

        document.getElementById('graficaCircular').style.background = `
            conic-gradient(
                #e74c3c 0deg \${gEnojo}deg,
                #f1c40f \${gEnojo}deg \${gEnojo + gFeli}deg,
                #95a5a6 \${gEnojo + gFeli}deg \${gEnojo + gFeli + gNeu}deg,
                #3498db \${gEnojo + gFeli + gNeu}deg 360deg
            )
        `;

        document.getElementById('p-enojo').textContent = enojo.toFixed(1) + '%';
        document.getElementById('p-felicidad').textContent = felicidad.toFixed(1) + '%';
        document.getElementById('p-neutral').textContent = neutral.toFixed(1) + '%';
        document.getElementById('p-tristeza').textContent = tristeza.toFixed(1) + '%';
    }

    // EVENTOS
    captureBtn.addEventListener('click', captureAndAnalyze);
    
    autoBtn.addEventListener('click', () => {
        isAutoMode = !isAutoMode;
        if (isAutoMode) {
            autoBtn.textContent = '⏹️ Detener Auto';
            autoBtn.style.background = '#ff922b';
            autoInterval = setInterval(captureAndAnalyze, 3000);
            captureAndAnalyze();
        } else {
            clearInterval(autoInterval);
            autoBtn.textContent = '🔄 Modo Automático';
            autoBtn.style.background = '#e94560';
        }
    });

    stopBtn.addEventListener('click', () => {
        if (stream) stream.getTracks().forEach(t => t.stop());
        isCameraRunning = false;
        clearInterval(autoInterval);
        captureBtn.disabled = autoBtn.disabled = stopBtn.disabled = true;
        statusDiv.textContent = '⏹️ Cámara apagada';
    });

    graficaBtn.addEventListener('click', () => {
        const container = document.getElementById('graficaContainer');
        const isVisible = container.style.display === 'block';
        container.style.display = isVisible ? 'none' : 'block';
        graficaBtn.textContent = isVisible ? '📊 Ver Gráfica' : '📊 Ocultar Gráfica';
        if (!isVisible) actualizarGrafica();
    });

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            captureAndAnalyze();
        }
    });

    window.onload = startCamera;
</script>
</body>
</html>
